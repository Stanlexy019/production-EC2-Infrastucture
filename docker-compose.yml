version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - /opt/stan/.env
    expose:
      - "3500"
    depends_on:
      - mongo-extra

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  mongo-extra:
    image: mongo:6
    container_name: mongo-extra
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data:
